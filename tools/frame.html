<!doctype html>
<!-- Dev helper: shows the app in an iPhone-sized frame (headless Chrome cannot open windows narrower than 500px).
     ?h=660 sets the frame height (Safari with its toolbars is about 660; installed is about 760-800).
     ?src=https://... frames another address instead of ../public/. -->
<meta charset="utf-8">
<style>html, body { margin: 0; background: #400; } iframe { border: 0; width: 390px; height: 760px; display: block; }</style>
<iframe id="f"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  if (q.has('h')) f.style.height = q.get('h') + 'px';
  const src = q.get('src') || '../public/index.html';
  q.delete('h'); q.delete('src');
  f.src = src + '?' + q.toString();
</script>
